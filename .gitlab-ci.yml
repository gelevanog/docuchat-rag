stages:
  - lint
  - test
  - build

default:
  interruptible: true

variables:
  UV_CACHE_DIR: "$CI_PROJECT_DIR/.cache/uv"
  UV_LINK_MODE: copy
  npm_config_cache: "$CI_PROJECT_DIR/.cache/npm"
  NEXT_TELEMETRY_DISABLED: "1"

.backend:
  image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
  before_script:
    - cd backend
    - uv sync --locked
  cache:
    key:
      files: [backend/uv.lock]
    paths: [.cache/uv]

.frontend:
  image: node:24-alpine
  before_script:
    - cd frontend
    - npm ci --no-audit --no-fund
  cache:
    key:
      files: [frontend/package-lock.json]
    paths: [.cache/npm]

backend:lint:
  extends: .backend
  stage: lint
  script:
    - uv run ruff check .
    - uv run ruff format --check .
    - uv run mypy app scripts

frontend:lint:
  extends: .frontend
  stage: lint
  script:
    - npm run lint
    - npx tsc --noEmit

backend:test:
  extends: .backend
  stage: test
  services:
    - name: pgvector/pgvector:pg16
      alias: postgres
  variables:
    POSTGRES_USER: docuchat
    POSTGRES_PASSWORD: docuchat
    POSTGRES_DB: docuchat_test
    TEST_DATABASE_URL: postgresql+asyncpg://docuchat:docuchat@postgres:5432/docuchat_test
    REQUIRE_TEST_DB: "1"
  script:
    - uv run pytest -v --junitxml=report.xml
  artifacts:
    when: always
    reports:
      junit: backend/report.xml

frontend:build:
  extends: .frontend
  stage: build
  script:
    - npm run build

docker:build:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - docker build -t docuchat-backend:$CI_COMMIT_SHORT_SHA backend
    - docker build -t docuchat-frontend:$CI_COMMIT_SHORT_SHA frontend
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
