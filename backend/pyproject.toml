[project]
name = "docuchat"
version = "0.1.0"
description = "DocuChat backend: retrieval-augmented chat over your documents with cited answers."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.16",
    "anthropic>=1.8,<2",
    "asyncpg>=0.30",
    "fastapi>=0.140",
    "openai>=2.0",
    "pgvector>=0.4",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pypdf>=5.0",
    "python-docx>=1.1",
    "python-multipart>=0.0.18",
    "pyyaml>=6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "structlog>=24.4",
    "tiktoken>=0.8",
    "uvicorn[standard]>=0.32",
]

[project.optional-dependencies]
# Local cross-encoder re-ranking (RERANKER=cross-encoder): ONNX Runtime, no PyTorch.
rerank = ["fastembed>=0.8"]

[dependency-groups]
dev = [
    "httpx>=0.28",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
filterwarnings = ["error::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["migrations/script.py.mako"]

[tool.ruff.lint]
select = [
    "E", "W", "F", "I", "B", "UP", "N", "SIM", "C4", "RUF", "ASYNC", "PT", "RET", "PL", "TID",
]
ignore = [
    "PLR0913",  # FastAPI endpoints and constructors legitimately take many arguments
    "PLR2004",  # magic values are fine in tests and small heuristics
    "RUF001",   # the ellipsis character is intentional in snippets
    "SIM905",   # word lists written as "a b c".split() are easier to read
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR0915"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File"]

[tool.mypy]
# 3.12 matches .python-version, Docker and CI. numpy (from the `rerank` extra) ships stubs with
# 3.12-only syntax; ruff's py311 target still guards the source against newer syntax.
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "docx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Optional `rerank` extra: fully typed when installed, treated as Any when it isn't.
module = ["fastembed.*"]
ignore_missing_imports = true
