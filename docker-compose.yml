# DocuChat: PostgreSQL + pgvector, FastAPI backend, Next.js frontend.
# `docker compose up --build` runs end-to-end with the offline `fake` provider (no API keys).
# Values below can be overridden in a .env file next to this compose file (see .env.example).
name: docuchat

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-docuchat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-docuchat}
      POSTGRES_DB: ${POSTGRES_DB:-docuchat}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      args:
        # BACKEND_EXTRAS=rerank installs the local cross-encoder for RERANKER=cross-encoder.
        EXTRAS: ${BACKEND_EXTRAS:-}
        RERANK_MODEL: ${RERANK_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-docuchat}:${POSTGRES_PASSWORD:-docuchat}@db:5432/${POSTGRES_DB:-docuchat}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      LLM_PROVIDER: ${LLM_PROVIDER:-fake}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-fake}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-1536}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_CHAT_MODEL: ${OPENAI_CHAT_MODEL:-gpt-5-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_EFFORT: ${ANTHROPIC_EFFORT:-medium}
      CHUNK_SIZE_TOKENS: ${CHUNK_SIZE_TOKENS:-400}
      CHUNK_OVERLAP_TOKENS: ${CHUNK_OVERLAP_TOKENS:-60}
      RETRIEVAL_TOP_K: ${RETRIEVAL_TOP_K:-6}
      RERANKER: ${RERANKER:-none}
      RERANK_CANDIDATES: ${RERANK_CANDIDATES:-20}
      RERANK_MODEL: ${RERANK_MODEL:-Xenova/ms-marco-MiniLM-L-6-v2}
    volumes:
      - uploads:/data/uploads
      - ./sample_data:/sample_data:ro
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
